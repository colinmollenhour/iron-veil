services:
  # The Database Proxy
  proxy:
    build: .
    restart: unless-stopped
    ports:
      - "6543:6543"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
    volumes:
      - ./proxy.yaml:/usr/local/bin/proxy.yaml
    command: ["./iron-veil", "--upstream-host", "postgres", "--upstream-port", "5432", "--config", "proxy.yaml", "--api-port", "3001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The Upstream Database (Production Simulation)
  # TLS is opt-in: see docker-compose.tls.yml and scripts/generate_certs.sh
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: postgres
    ports:
      # Demo database with a default password: keep it off the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
