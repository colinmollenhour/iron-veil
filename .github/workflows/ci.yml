name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Start integration dependencies
        run: docker compose up -d --build

      - name: Wait for proxy API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
              echo "Proxy API is ready"
              exit 0
            fi
            echo "Waiting for proxy API... ($i/60)"
            sleep 2
          done
          echo "Proxy API did not become ready in time"
          docker compose ps
          docker compose logs --no-color proxy postgres || true
          exit 1

      - name: Run tests
        run: cargo test --all-features

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color proxy postgres || true

      - name: Stop integration dependencies
        if: always()
        run: docker compose down -v --remove-orphans

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
